[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verified-neural-training-engine"
version = "0.1.0"
description = "A verified NumPy neural training engine"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.6"]

[project.scripts]
neural-engine = "neural_engine.cli.main:main"

[tool.setuptools.packages.find]
include = ["neural_engine*"]